# ============================================================
# secret.yaml — Sensitive values (DB password, JWT signing key)
# ============================================================
# Values are supplied at deploy time via --set, never committed.
# `required` makes Helm refuse to render if either is missing, so a
# deploy fails loudly instead of silently using the insecure defaults
# baked into application.yml.
# ============================================================
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "java-app.fullname" . }}-secrets
  labels:
    {{- include "java-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ required "secrets.dbPassword is required (pass --set secrets.dbPassword=...)" .Values.secrets.dbPassword | quote }}
  JWT_SECRET: {{ required "secrets.jwtSecret is required (pass --set secrets.jwtSecret=...)" .Values.secrets.jwtSecret | quote }}
{{- end }}
