{{- if .Values.pdb.enabled }}
# ============================================================
# pdb.yaml — PodDisruptionBudget for the app
# ============================================================
# Caps how many app pods may be down at once during VOLUNTARY
# disruptions: node upgrades, Autopilot bin-packing, `kubectl drain`.
# It has no effect on involuntary ones (node crash, OOM kill).
#
# ⚠️  A PDB is only meaningful at replicaCount >= 2. With a single
#     replica, minAvailable: 1 means "never evict this pod", which
#     stalls Autopilot node upgrades instead of protecting anything.
#     The guard below refuses to render that configuration.
#
# NOTE: the enabling conditional sits ABOVE this comment block
# deliberately. A disabled template whose comments still render
# produces a document with no apiVersion, failing the whole install.
# ============================================================
{{- if lt (int .Values.replicaCount) 2 }}
{{- fail "pdb.enabled=true requires replicaCount >= 2. With one replica a PDB blocks node drains rather than providing availability. Either set replicaCount: 2 or set pdb.enabled: false." }}
{{- end }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "java-app.fullname" . }}
  labels:
    {{- include "java-app.labels" . | nindent 4 }}
spec:
  # minAvailable, not maxUnavailable: expressed as a floor on capacity,
  # which stays correct if replicaCount changes later.
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "java-app.selectorLabels" . | nindent 6 }}
{{- end }}
